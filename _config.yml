# Site settings
title: −4 Kelvin LLC
description: >-
  −4 Kelvin LLC is an independent product studio. We design, build and operate
  our own apps: Nhom, for finding people to do things with, and Mines of Idle
  Doomath, an idle math-mining game.
# The canonical host. GitHub Pages serves `www` (see CNAME) and the apex
# 301-redirects to it, so canonicals, og:url, the sitemap and | absolute_url
# must all emit the www host — pointing a canonical at a redirecting host is an
# SEO inconsistency. The apex is the friendlier URL to publish and to enter in
# Apple's enrollment form; either resolves to the same site.
url: "https://www.minus4kelvin.com"
apex_url: "https://minus4kelvin.com"
baseurl: ""
lang: en

# A single contact address for everything: support, account & data deletion,
# press and security reports. Cloudflare Email Routing is already configured for
# this domain (MX + SPF verified). Apple requires that a work email address be
# associated with the organization's domain name, so this must NOT be a
# gmail.com address.
#
# To split these out into separate mailboxes later, add keys here (e.g.
# contact_email_press) and reference them from the templates.
contact_email: kelvin@minus4kelvin.com

# Legal entity.
#
# No D-U-N-S number is published here on purpose: it is collected on the Apple
# enrollment form and cross-checked against Dun & Bradstreet. Apple's website
# requirement is only that the site is public, functional and on the entity's
# own domain — it has no field list, so the number is not needed publicly.
entity:
  name: "−4 Kelvin LLC"
  type: "Limited Liability Company (LLC)"
  jurisdiction: "Texas, United States"
  support_hours: "Monday–Friday, 09:00–17:00 UTC"
  deletion_sla: "30 days"

# Products operated by the studio.
products:
  - name: "Nhom"
    slug: "nhom"
    url: "https://nhom.app"
    tagline: "Find your people. Do the thing."
    summary: >-
      A social app for local and online events. Browse lobbies for sports, food,
      gaming, nights out and dates; filter by activity, distance and time; then
      join or host your own.
    status: "Live"
    platforms: "iOS · Android · Web"
    languages: "English · Tiếng Việt"
  - name: "Mines of Idle Doomath"
    slug: "mines-of-idle-doomath"
    url: "https://minesofdoom.pages.dev"
    canonical: "https://minesofdoom.minus4kelvin.com"
    tagline: "Keep the crew mining. Just answer the maths."
    summary: >-
      A single-player idle game about a small crew working a very deep shaft.
      Solve a short equation to earn minerals, buy upgrades and hired miners,
      and sink a new shaft when a run slows down.
    status: "Live"
    platforms: "iOS · Android · Web"

# Build settings
plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - README.md
  - .github